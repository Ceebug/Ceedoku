# Ceedoku release configuration
# Set the version number for this release.
# Changelog categories: add, fix, remove, change, improve.
# Each category is optional. Use "-" for each item.
# Use "title" and "items" to group related items under a heading.
# Example:
# add:
#   - A new feature.
#   - title: "New settings"
#     items:
#       - Enable pencil mode.
#       - Enable erase mode.
# Developer notes use the same categories and structure as the changelog.

version: "10.0.7"

changelog:
  fix:
    - Closing Settings while capturing a keybind now cancels keybind capture and removes focus from the keybind field.
    - The Edit save title heading now uses the correct text colour.
    - The Edit save title dialog now has a proper description with corrected text colour and styling.
    - The Cancel button in the Edit save title dialog now has enough space to display its label without overflowing.
