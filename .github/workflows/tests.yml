name: "CI: Lint/Test"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: "CI: Test/Lint"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install linters
        run: npm install --no-save --no-package-lock --ignore-scripts htmlhint stylelint stylelint-config-recommended eslint @eslint/js

      - name: Lint HTML
        run: |
          mapfile -d '' files < <(find . -type f -name '*.html' -not -path './node_modules/*' -not -path './.git/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No HTML files found!"
            exit 1
          fi
          ./node_modules/.bin/htmlhint "${files[@]}"

      - name: Lint CSS
        run: |
          mapfile -d '' files < <(find . -type f -name '*.css' -not -path './node_modules/*' -not -path './.git/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No CSS files found!"
            exit 1
          fi
          ./node_modules/.bin/stylelint "${files[@]}"

      - name: Lint JavaScript
        run: |
          mapfile -d '' files < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JavaScript files found!"
            exit 1
          fi
          ./node_modules/.bin/eslint "${files[@]}"

      - name: Test JavaScript
        run: |
          mapfile -d '' tests < <(find test -type f -name '*.js' -print0)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No JavaScript test files found!"
            exit 1
          fi
          node --test "${tests[@]}"
