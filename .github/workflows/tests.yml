name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run all tests
        run: |
          mapfile -d '' tests < <(find test -type f -name '*.js' -print0)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No JavaScript test files found!"
            exit 1
          fi
          node --test "${tests[@]}"
