name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Only grab the folder you publish (remove both lines to use the whole repo):
          sparse-checkout: site
          sparse-checkout-cone-mode: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

      - id: deployment
        uses: actions/deploy-pages@v4