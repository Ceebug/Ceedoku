name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_DIR: ${{ github.workspace }}
      PUBLISH_DIR: ${{ runner.temp }}/pages-site
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local

    steps:
      - name: Fetch publisher script (no clone)
        shell: bash
        run: |
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/.github/scripts/pages-publisher.go?ref=${{ github.sha }}" \
            > "$RUNNER_TEMP/pages-publisher.go"

      - name: Compile Go publisher
        shell: bash
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "$RUNNER_TEMP/pages-publisher" \
            "$RUNNER_TEMP/pages-publisher.go"

      - name: Prepare website
        shell: bash
        run: '"$RUNNER_TEMP/pages-publisher" prepare'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
