
name: Deploy to Github Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    environment:
      name: github-pages

    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_DIR: ${{ github.workspace }}/source
      PUBLISH_DIR: ${{ runner.temp }}/pages-site

    steps:
      - name: Fetch exact commit
        shell: bash
        run: |
          mkdir -p "$SOURCE_DIR"
          git -C "$SOURCE_DIR" init

          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)

          git -C "$SOURCE_DIR" \
            -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            fetch --depth=1 \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$GITHUB_SHA"

          git -C "$SOURCE_DIR" checkout --detach FETCH_HEAD

      - name: Compile Go publisher
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "$RUNNER_TEMP/pages-publisher" \
            "$SOURCE_DIR/.github/scripts/pages-publisher.go"

      - name: Prepare website
        run: "$RUNNER_TEMP/pages-publisher" prepare

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

      - name: Deploy website
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: "$RUNNER_TEMP/pages-publisher" deploy
