
name: Deploy to Github Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    environment:
      name: github-pages

    env:
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_DIR: ${{ github.workspace }}
      PUBLISH_DIR: ${{ runner.temp }}/pages-site

    steps:
      - name: Compile Go publisher
        shell: bash
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "$RUNNER_TEMP/pages-publisher" \
            "$SOURCE_DIR/.github/scripts/pages-publisher.go"

      - name: Prepare website
        run: "$RUNNER_TEMP/pages-publisher" prepare

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 1

      - name: Deploy website
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: "$RUNNER_TEMP/pages-publisher" deploy
