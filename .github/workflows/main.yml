name: Sync website

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout game repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: ceedoku/ceedoku.github.io
          token: ${{ secrets.sync }}
          path: website
          fetch-depth: 0

      - name: Copy game files
        run: |
          cp index.html code.md website/

          mkdir -p website/src/css
          mkdir -p website/src/images
          mkdir -p website/src/js
          mkdir -p website/src/pwa
          mkdir -p website/src/sounds

          cp src/css/style.css website/src/css/
          cp src/css/hoverPatch.css website/src/css/

          cp -r src/images/* website/src/images/

          cp src/js/script.js website/src/js/
          cp src/js/puzzleGen.js website/src/js/

          cp -r src/js/lib/* website/src/js/lib/ 2>/dev/null || true

          cp src/pwa/manifest.json website/src/pwa/
          cp src/pwa/serviceWorker.js website/src/pwa/

          cp src/sounds/* website/src/sounds/

      - name: Create sync commit
        run: |
          cd website

          git config user.name "Ceebot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          CHANGES=$(git diff --cached --name-only)

          if [ -z "$CHANGES" ]; then
            echo "No changes to sync"
            exit 0
          fi

          MESSAGE="Sync game from Ceedoku"$'\n\n'"Synced:"$'\n'

          while IFS= read -r file; do
            MESSAGE="$MESSAGE- $file"$'\n'
          done <<< "$CHANGES"

          git commit -m "$MESSAGE"

          git push
